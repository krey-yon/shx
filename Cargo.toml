[package]
name = "shx"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
authors = ["shx contributors"]
description = "Open-source minimal Warp alternative: an AI-assisted developer terminal"
readme = "README.md"
license = "MIT"
keywords = ["terminal", "ai", "shell", "cli", "assistant", "warp"]
categories = ["command-line-utilities"]

[[bin]]
name = "shx"
path = "src/main.rs"

[lib]
name = "shx"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
indicatif = "0.18.6"
owo-colors = "4.4.0"
regex = "1.13.1"
reedline = "0.49.0"
# Every provider (gemini, anthropic, openai, ollama, ...) is compiled in by
# default; features only gate optional extras like vector stores.
rig = { version = "0.42.0", features = ["memory"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
# `test-utils` gives us rig's mock completion models so agent tests run with no
# network and no API key.
rig = { version = "0.42.0", features = ["memory", "test-utils"] }
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Lint levels are crate-wide so that `cargo clippy -- -D warnings` in CI is the
# same check a developer gets locally. Deliberately strict: the code is small
# enough to keep warning-free.
[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# `unwrap`/`expect` in library code is a defect; tests may still use them.
unwrap_used = "warn"
expect_used = "warn"
# Command safety and JSON handling are the reason this tool exists, so the
# fallible paths must be visible in review.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# Our data tables are const arrays of string literals; nesting them as modules
# to satisfy this lint would hurt readability for no benefit.
too_many_lines = "allow"
module_name_repetitions = "allow"

